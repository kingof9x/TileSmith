# Builds TileSmith for Windows, Mac and Linux and attaches the files to a GitHub Release.
#
# To publish a version: Actions tab > Build and release > Run workflow > type the version (for example 3.4) > Run.
# The workflow builds everything, then creates the release v3.4 itself. (Pushing a tag such as v3.4 also works.)
# Leave the version box empty to only TEST the build: the files are then kept for 7 days under the run's Artifacts.
#
# Linux: .AppImage, .deb, .rpm and .pacman (Arch) come from the "linux" job; .snap and .flatpak have their own jobs
# that may fail without stopping the release. The downloads live on the Releases page (no container Packages).
#
# The builds are UNSIGNED (Windows shows SmartScreen, on a Mac use right-click > Open). They do NOT contain the
# NDI(R) runtime or ffmpeg (their licences do not allow putting them in the repository); NDI(R) output needs the free
# NDI Runtime installed on the PC, and video export needs ffmpeg. See BUILD-WINDOWS.txt and BUILD-MAC.txt.
name: Build and release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release, for example 3.3 (leave empty to only test the build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tilesmith-desktop/TileSmith-Portable.exe
          if-no-files-found: error
          retention-days: 7

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: tilesmith-desktop/TileSmith-*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools for .rpm and Arch packages
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            tilesmith-desktop/dist/TileSmith-*-linux-x64.AppImage
            tilesmith-desktop/dist/TileSmith-*-linux-x64.deb
            tilesmith-desktop/dist/TileSmith-*-linux-x64.rpm
            tilesmith-desktop/dist/TileSmith-*-linux-x64.pacman
          if-no-files-found: error
          retention-days: 7

  snap:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo snap install snapcraft --classic
      - run: npm install
      - run: npm run dist:snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: tilesmith-desktop/dist/*.snap
          if-no-files-found: error
          retention-days: 7

  flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flatpak tools and runtimes
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npm install
      - run: npm run dist:flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: tilesmith-desktop/dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (already on the runner; accept licences and add the platform)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - run: npm install
      - run: npm run web
      - run: npx cap sync android
      - name: Build the APK (debug-signed, installs on any device or emulator)
        working-directory: tilesmith-desktop/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TileSmith-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: tilesmith-desktop/mobile/TileSmith-android.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [windows, mac, linux, snap, flatpak, android]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.mac.result == 'success' && needs.linux.result == 'success' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          VER="${TAG#v}"
          echo "Publishing release $TAG"
          mkdir upload
          cp dist-files/*/* upload/
          # file names without the version, so the README can link to .../releases/latest/download/<name> forever
          shopt -s nullglob
          mv upload/TileSmith-Portable.exe upload/TileSmith-windows-portable.exe
          # electron-builder puts the package.json version (for example 3.3.0) in the name, which need not equal the release version
          for f in upload/TileSmith-*; do n="$(dirname "$f")/$(basename "$f" | sed -E 's/-[0-9]+(\.[0-9]+)+-/-/')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          for f in upload/*.snap; do mv "$f" upload/TileSmith-linux-x64.snap; done
          for f in upload/*.flatpak; do mv "$f" upload/TileSmith-linux-x64.flatpak; done
          cp tilesmith-desktop/TileSmith-Manual.pdf tilesmith-desktop/TileSmith-Mobile-Manual.pdf tilesmith-desktop/TileSmith-App-Spec.md upload/
          ls -la upload
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TileSmith $VER" \
              --notes "Windows portable app, Mac universal installer and Linux packages (AppImage, deb, rpm, Arch pacman, snap, flatpak) and an Android APK (debug-signed, for testing), unsigned. Manuals and the app spec are attached. NDI runtime and ffmpeg are not included: see BUILD-WINDOWS.txt / BUILD-MAC.txt." \
              upload/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: upload/*
          retention-days: 7

  virustotal:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: upload
      - name: Scan every release file on VirusTotal and add the report links to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "::warning::No VT_API_KEY secret, so the VirusTotal scan was skipped."; exit 0; fi
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          API=https://www.virustotal.com/api/v3
          ROWS=""
          cd upload
          for f in *; do
            case "$f" in *.pdf|*.md) continue;; esac     # documents are not programs
            SHA=$(sha256sum "$f" | cut -d' ' -f1)
            SIZE=$(stat -c %s "$f")
            if [ "$SIZE" -gt 30000000 ]; then URL=$(curl -sS -H "x-apikey: $VT_API_KEY" "$API/files/upload_url" | jq -r .data); else URL="$API/files"; fi
            ID=$(curl -sS -H "x-apikey: $VT_API_KEY" -F "file=@$f" "$URL" | jq -r '.data.id // empty')
            RES="not scanned"
            if [ -n "$ID" ]; then
              for i in $(seq 1 60); do
                sleep 15
                J=$(curl -sS -H "x-apikey: $VT_API_KEY" "$API/analyses/$ID")
                if [ "$(echo "$J" | jq -r '.data.attributes.status // empty')" = "completed" ]; then
                  BAD=$(echo "$J" | jq -r '(.data.attributes.stats.malicious // 0) + (.data.attributes.stats.suspicious // 0)')
                  TOT=$(echo "$J" | jq -r '[.data.attributes.stats[]] | add - (.data.attributes.stats["type-unsupported"] // 0) - (.data.attributes.stats.timeout // 0)')
                  RES="$BAD / $TOT engines flag it"; break
                fi
              done
              [ "$RES" = "not scanned" ] && RES="scan still running"
            fi
            echo "$f: $RES"
            ROWS="$ROWS| $f | [$RES](https://www.virustotal.com/gui/file/$SHA) | \`$SHA\` |"$'\n'
            sleep 16        # free VirusTotal keys allow 4 requests a minute
          done
          {
            echo "## VirusTotal scan"
            echo
            echo "Every program file in this release was uploaded to [VirusTotal](https://www.virustotal.com/) by the build. TileSmith is unsigned, and a few engines sometimes flag unsigned Electron apps by mistake (false positives); the source code is public so you can check what was built."
            echo
            echo "| File | Result | SHA-256 |"
            echo "|---|---|---|"
            printf "%s" "$ROWS"
          } > /tmp/vt.md
          BODY=$(gh release view "$TAG" --json body -q .body | sed '/^## VirusTotal scan/,$d')
          printf "%s\n\n%s\n" "$BODY" "$(cat /tmp/vt.md)" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
