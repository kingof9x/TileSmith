# Builds TileSmith for Windows and Mac and attaches the files to a GitHub Release.
#
# To publish a version:  git tag v3.4  and push the tag, or on GitHub: Releases > Draft a new release > choose a new
# tag such as v3.4 > Publish. To only TEST the build, open the Actions tab > "Build and release" > Run workflow;
# the finished files are then kept for 7 days under that run's Artifacts and no release is made.
#
# The builds are UNSIGNED (Windows shows SmartScreen, on a Mac use right-click > Open). They do NOT contain the
# NDI(R) runtime or ffmpeg (their licences do not allow putting them in the repository); NDI(R) output needs the free
# NDI Runtime installed on the PC, and video export needs ffmpeg. See BUILD-WINDOWS.txt and BUILD-MAC.txt.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tilesmith-desktop/TileSmith-Portable.exe
          retention-days: 7

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: tilesmith-desktop/TileSmith-*.dmg
          retention-days: 7

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp dist-files/windows/TileSmith-Portable.exe "TileSmith-$VER-windows-portable.exe"
          gh release create "$GITHUB_REF_NAME" \
            --title "TileSmith $VER" \
            --notes "Windows portable app and Mac universal installer (unsigned). Manuals and the app spec are attached. NDI runtime and ffmpeg are not included: see BUILD-WINDOWS.txt / BUILD-MAC.txt." \
            "TileSmith-$VER-windows-portable.exe" \
            dist-files/mac/*.dmg \
            tilesmith-desktop/TileSmith-Manual.pdf \
            tilesmith-desktop/TileSmith-Mobile-Manual.pdf \
            tilesmith-desktop/TileSmith-App-Spec.md
