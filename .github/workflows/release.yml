# Builds TileSmith for Windows, Mac and Linux and attaches the files to a GitHub Release.
#
# To publish a version: Actions tab > Build and release > Run workflow > type the version (for example 3.4) > Run.
# The workflow builds both apps, then creates the release v3.4 itself. (Pushing a tag such as v3.4 also works.)
# Old note:  Releases > Draft a new release > choose a new tag such as v3.4 > Publish release
# (or push a git tag v3.4). Tags starting with v or a digit (v3.4 or 3.4) both work. The workflow then builds and attaches the files to that release. To only TEST the build, open the Actions tab > "Build and release" > Run workflow;
# the finished files are then kept for 7 days under that run's Artifacts and no release is made.
#
# The builds are UNSIGNED (Windows shows SmartScreen, on a Mac use right-click > Open). They do NOT contain the
# NDI(R) runtime or ffmpeg (their licences do not allow putting them in the repository); NDI(R) output needs the free
# NDI Runtime installed on the PC, and video export needs ffmpeg. See BUILD-WINDOWS.txt and BUILD-MAC.txt.
name: Build and release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release, for example 3.3 (leave empty to only test the build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tilesmith-desktop/TileSmith-Portable.exe
          if-no-files-found: error
          retention-days: 7

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: tilesmith-desktop/TileSmith-*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            tilesmith-desktop/dist/TileSmith-*-linux-x64.AppImage
            tilesmith-desktop/dist/TileSmith-*-linux-x64.deb
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [windows, mac, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          VER="${TAG#v}"
          echo "Publishing release $TAG"
          cp dist-files/windows/TileSmith-Portable.exe "TileSmith-$VER-windows-portable.exe"
          FILES=("TileSmith-$VER-windows-portable.exe" dist-files/mac/*.dmg dist-files/linux/* tilesmith-desktop/TileSmith-Manual.pdf tilesmith-desktop/TileSmith-Mobile-Manual.pdf tilesmith-desktop/TileSmith-App-Spec.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TileSmith $VER" \
              --notes "Windows portable app and Mac universal installer (unsigned). Manuals and the app spec are attached. NDI runtime and ffmpeg are not included: see BUILD-WINDOWS.txt / BUILD-MAC.txt." \
              "${FILES[@]}"
          fi
