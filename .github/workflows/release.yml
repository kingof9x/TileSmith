# Builds TileSmith for Windows, Mac and Linux and attaches the files to a GitHub Release.
# Windows: TileSmith-windows-setup.exe (installer) and TileSmith-windows-portable.exe. Mac: TileSmith-mac-universal.dmg
# and TileSmith-mac-universal.pkg (installer). The app's "Check for updates" (Info window) reads the latest release
# and offers the matching file, so keep these names.
#
# To publish a version: Actions tab > Build and release > Run workflow > leave "next" (last release + 1) or type a version (for example 3.4) > Run.
# The workflow builds everything, then creates the release v3.4 itself. (Pushing a tag such as v3.4 also works.)
# Clear the version box to only TEST the build: the files are then kept for 7 days under the run's Artifacts.
#
# Linux: .AppImage, .deb, .rpm and .pacman (Arch) come from the "linux" job; .snap and .flatpak have their own jobs
# that may fail without stopping the release. The downloads live on the Releases page (no container Packages).
# When the release is published, two separate workflows start by themselves: "Build documentation" (docs.yml) builds the
# manuals and the app spec for the release version and attaches them to the release, and "VirusTotal scan"
# (virustotal.yml) scans the files and writes the results to VIRUSTOTAL.md in the project root.
#
# The builds are UNSIGNED (Windows shows SmartScreen, on a Mac use right-click > Open). They do NOT contain the
# NDI(R) runtime or ffmpeg (their licences do not allow putting them in the repository); NDI(R) output needs the free
# NDI Runtime installed on the PC, and video export needs ffmpeg. See BUILD-WINDOWS.txt and BUILD-MAC.txt.
name: Build and release

on:
  pull_request:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. "next" = last release + 1 (for example 1.3 after 1.2), or type one (for example 2.0). Empty = only test the build, no release.'
        required: false
        default: 'next'

permissions:
  contents: write

jobs:
  version:
    # Works out the release version: from the Run workflow box ("next" = last release + 1)
    # or from a pushed v* tag. Empty means "only test the build, no release".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            if [ "$INPUT" = next ]; then
              last=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0] // ""')
              num=$(printf '%s' "$last" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
              if [ -z "$num" ]; then v=1.0; else v=$(printf '%s' "$num" | awk -F. -v OFS=. '{$NF=$NF+1; print}'); fi
              echo "Last release: ${last:-none}"
            else
              v="${INPUT#[vV]}"
            fi
          fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$v' is not a version number. Use numbers like 1.4 or 2.0.1, or 'next'."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "### Releasing v$v" >> "$GITHUB_STEP_SUMMARY"; else echo "### Test build only, no release" >> "$GITHUB_STEP_SUMMARY"; fi

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ needs.version.outputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            tilesmith-desktop/TileSmith-Portable.exe
            tilesmith-desktop/TileSmith-*-windows-setup.exe
          if-no-files-found: error
          retention-days: 7

  mac:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ needs.version.outputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            tilesmith-desktop/TileSmith-*.dmg
            tilesmith-desktop/TileSmith-*.pkg
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ needs.version.outputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools for .rpm and Arch packages
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            tilesmith-desktop/dist/TileSmith-*-linux-x64.AppImage
            tilesmith-desktop/dist/TileSmith-*-linux-x64.deb
            tilesmith-desktop/dist/TileSmith-*-linux-x64.rpm
            tilesmith-desktop/dist/TileSmith-*-linux-x64.pacman
          if-no-files-found: error
          retention-days: 7

  snap:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ needs.version.outputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo snap install snapcraft --classic
      - run: npm install
      - run: npm run dist:snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: tilesmith-desktop/dist/*.snap
          if-no-files-found: error
          retention-days: 7

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ needs.version.outputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flatpak tools and runtimes
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npm install
      - run: npm run dist:flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: tilesmith-desktop/dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  android:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ needs.version.outputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (already on the runner; accept licences and add the platform)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - run: npm install
      - run: npm run web
      - run: npx cap sync android
      - name: Build the APK (debug-signed, installs on any device or emulator)
        working-directory: tilesmith-desktop/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TileSmith-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: tilesmith-desktop/mobile/TileSmith-android.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, windows, mac, linux, snap, flatpak, android]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.mac.result == 'success' && needs.linux.result == 'success' && needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          VER="${TAG#v}"
          echo "Publishing release $TAG"
          mkdir upload
          cp dist-files/*/* upload/
          # file names without the version, so the README can link to .../releases/latest/download/<name> forever
          shopt -s nullglob
          [ ! -e upload/TileSmith-Portable.exe ] || mv upload/TileSmith-Portable.exe upload/TileSmith-windows-portable.exe
          # electron-builder puts the package.json version (for example 3.3.0) in the name, which need not equal the release version
          for f in upload/TileSmith-*; do n="$(dirname "$f")/$(basename "$f" | sed -E 's/-[0-9]+(\.[0-9]+)+-/-/')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          for f in upload/*.snap; do [ "$f" = upload/TileSmith-linux-x64.snap ] || mv "$f" upload/TileSmith-linux-x64.snap; done
          for f in upload/*.flatpak; do [ "$f" = upload/TileSmith-linux-x64.flatpak ] || mv "$f" upload/TileSmith-linux-x64.flatpak; done
          ls -la upload
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TileSmith $VER" \
              --notes "Windows installer and portable app, Mac universal disk image (.dmg) and installer (.pkg), Linux packages (AppImage, deb, rpm, Arch pacman, snap, flatpak) and an Android APK (debug-signed, for testing), unsigned. Manuals and the app spec are attached a few minutes after the release by the Build documentation workflow. NDI runtime and ffmpeg are not included: see BUILD-WINDOWS.txt / BUILD-MAC.txt." \
              upload/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: upload/*
          retention-days: 7
      - name: Remember the release tag for the VirusTotal workflow
        env:
          INPUT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          echo "$TAG" > release-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.txt
          retention-days: 7
