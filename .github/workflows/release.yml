# Builds TileSmith for Windows, Mac and Linux and attaches the files to a GitHub Release.
#
# To publish a version: Actions tab > Build and release > Run workflow > type the version (for example 3.4) > Run.
# The workflow builds everything, then creates the release v3.4 itself. (Pushing a tag such as v3.4 also works.)
# Leave the version box empty to only TEST the build: the files are then kept for 7 days under the run's Artifacts.
#
# Linux: .AppImage, .deb, .rpm and .pacman (Arch) come from the "linux" job; .snap and .flatpak have their own jobs
# that may fail without stopping the release. The downloads live on the Releases page (no container Packages).
# The "docs" job builds the manuals and the app spec for the typed version. When the release is published, the separate
# workflow "VirusTotal scan" (virustotal.yml) scans the files and writes the results to VIRUSTOTAL.md in the project root.
#
# The builds are UNSIGNED (Windows shows SmartScreen, on a Mac use right-click > Open). They do NOT contain the
# NDI(R) runtime or ffmpeg (their licences do not allow putting them in the repository); NDI(R) output needs the free
# NDI Runtime installed on the PC, and video export needs ffmpeg. See BUILD-WINDOWS.txt and BUILD-MAC.txt.
name: Build and release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release, for example 3.3 (leave empty to only test the build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tilesmith-desktop/TileSmith-Portable.exe
          if-no-files-found: error
          retention-days: 7

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: tilesmith-desktop/TileSmith-*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools for .rpm and Arch packages
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            tilesmith-desktop/dist/TileSmith-*-linux-x64.AppImage
            tilesmith-desktop/dist/TileSmith-*-linux-x64.deb
            tilesmith-desktop/dist/TileSmith-*-linux-x64.rpm
            tilesmith-desktop/dist/TileSmith-*-linux-x64.pacman
          if-no-files-found: error
          retention-days: 7

  snap:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo snap install snapcraft --classic
      - run: npm install
      - run: npm run dist:snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: tilesmith-desktop/dist/*.snap
          if-no-files-found: error
          retention-days: 7

  flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flatpak tools and runtimes
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npm install
      - run: npm run dist:flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: tilesmith-desktop/dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tilesmith-desktop/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Put the release version into the app and the file names
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (already on the runner; accept licences and add the platform)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - run: npm install
      - run: npm run web
      - run: npx cap sync android
      - name: Build the APK (debug-signed, installs on any device or emulator)
        working-directory: tilesmith-desktop/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TileSmith-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: tilesmith-desktop/mobile/TileSmith-android.apk
          if-no-files-found: error
          retention-days: 7

  docs:
    # The manuals and the app spec are built here from the version typed in the Run workflow box, so the version on
    # their cover and footer, in the app and in the file names is always the same one.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put the release version into the app (the manuals read it from there)
        working-directory: tilesmith-desktop
        run: node scripts/set-version.js "${{ inputs.version || github.ref_name }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools for the screenshots and the PDFs
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Build the manuals and the app spec
        working-directory: manual-src
        run: |
          python make_manual.py
          python make_kit_shots.py
          python make_kit_anims.py
          python make_mobile_manual.py
          python make_spec.py
          mkdir -p ../docs-out
          cp ../tilesmith-desktop/TileSmith-Manual.pdf ../tilesmith-desktop/TileSmith-Mobile-Manual.pdf ../tilesmith-desktop/TileSmith-App-Spec.md ../docs-out/
      - name: Check that the manuals show the release version
        env:
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          V="${INPUT_VERSION#v}"
          if echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            for f in TileSmith-Manual.pdf TileSmith-Mobile-Manual.pdf; do
              pdftotext docs-out/$f - | grep -q "v$V" || { echo "::error::$f does not show version $V"; exit 1; }
            done
            head -1 docs-out/TileSmith-App-Spec.md | grep -q "TileSmith $V " || { echo "::error::the app spec does not show version $V"; exit 1; }
            echo "Manuals and spec show version $V"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs-out/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [windows, mac, linux, snap, flatpak, android, docs]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.mac.result == 'success' && needs.linux.result == 'success' && needs.docs.result == 'success' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          VER="${TAG#v}"
          echo "Publishing release $TAG"
          mkdir upload
          cp dist-files/*/* upload/
          # file names without the version, so the README can link to .../releases/latest/download/<name> forever
          shopt -s nullglob
          [ ! -e upload/TileSmith-Portable.exe ] || mv upload/TileSmith-Portable.exe upload/TileSmith-windows-portable.exe
          # electron-builder puts the package.json version (for example 3.3.0) in the name, which need not equal the release version
          for f in upload/TileSmith-*; do n="$(dirname "$f")/$(basename "$f" | sed -E 's/-[0-9]+(\.[0-9]+)+-/-/')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          for f in upload/*.snap; do [ "$f" = upload/TileSmith-linux-x64.snap ] || mv "$f" upload/TileSmith-linux-x64.snap; done
          for f in upload/*.flatpak; do [ "$f" = upload/TileSmith-linux-x64.flatpak ] || mv "$f" upload/TileSmith-linux-x64.flatpak; done
          ls -la upload
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TileSmith $VER" \
              --notes "Windows portable app, Mac universal installer and Linux packages (AppImage, deb, rpm, Arch pacman, snap, flatpak) and an Android APK (debug-signed, for testing), unsigned. Manuals and the app spec are attached. NDI runtime and ffmpeg are not included: see BUILD-WINDOWS.txt / BUILD-MAC.txt." \
              upload/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: upload/*
          retention-days: 7
      - name: Remember the release tag for the VirusTotal workflow
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          echo "$TAG" > release-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.txt
          retention-days: 7
